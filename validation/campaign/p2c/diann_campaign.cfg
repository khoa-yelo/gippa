# DIA-NN 2.3.1 settings for the campaign (handover plan, standard recipe step 4).
# The flags of validation/pilot/diann_A2.cfg, unchanged, without its --fasta lines: the FASTA
# files (the `gippa makedb` database, which already carries the contaminant library as CONT_
# records, plus any host or marker FASTA) are supplied by validation/campaign/slurm/diann_search.sbatch,
# as are --f, --lib, --out, --out-lib, --temp and --threads. --report-decoys is kept;
# --met-excision, --reanalyse and --rt-profiling are not used (pilot README, decision 7).

[step1]
--fasta-search
--gen-spec-lib
--predictor
--cut K*,R*
--missed-cleavages 1
--min-pep-len 7
--max-pep-len 30
--unimod4
--var-mods 1
--var-mod UniMod:35,15.994915,M
--min-pr-charge 1
--max-pr-charge 4
--min-pr-mz 300
--max-pr-mz 1800
--min-fr-mz 200
--max-fr-mz 1800
--peptidoforms
--verbose 1

[step2]
--gen-spec-lib
--qvalue 0.01
--report-decoys
--matrices
--peptidoforms
--verbose 1
